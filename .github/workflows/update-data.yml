name: Update Store Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run data generator
        run: python build_up/generate_store_map.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/stores.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -F - <<'EOF'
          # 自動更新店舖資料 (排程執行)

          - **Updated:** 由排程工作流程執行 generate_store_map.py，更新最新的全家便利商店霜淇淋資料
            - public/stores.json
          EOF
          git push
